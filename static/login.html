<!DOCTYPE html>

<head>

<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="/static/css/login.css?v=1">

<body>
<div class="wrap">
  <form class="box" id="f" novalidate>
    <h1>Almoxarifado</h1>

    <div class="pw">
      <input id="password" type="password" autocomplete="current-password">

    </div>
    <button type="submit" class="go pri" id="go">Entrar</button>
  </form>
</div>
